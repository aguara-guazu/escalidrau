name: Release

# Builds every platform on its own runner (a Windows installer cannot be made
# on macOS without Wine) and attaches the artifacts to the tag's release.
# Action majors are kept current because the runner deprecates older Node
# runtimes: every action here runs on node24, as does the build itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build -w web
      # Bundles the Electron main process, the MCP bridge and the hook.
      - run: npm run build -w desktop
      - run: npx electron-builder --${{ matrix.platform }} --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
